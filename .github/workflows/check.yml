name: 葛飾区施設チェック

on:
  schedule:
    # 日本時間 7・9・11・13・15・17・19・21・23時（cron は UTC で書く）
    - cron: "3 22,0,2,4,6,8,10,12,14 * * *"
  workflow_dispatch: {}   # 手動実行ボタン（テスト用）

permissions:
  contents: write         # last_state.json を書き戻すため

concurrency:
  group: katsushika-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo      # 日付・祝日判定を日本時間で行う
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存パッケージ
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: チェック実行
        run: python -u checker.py auto

      # メール送信に失敗した回もここは実行する（checker.py は通知できなかった枠を
      # 保存しないので、次回に再通知される）。push に失敗したらジョブを失敗にする
      - name: 前回結果（last_state.json）を保存
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add last_state.json
          if git diff --cached --quiet; then
            echo "last_state.json に変更なし"
            exit 0
          fi
          git commit -m "state: $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
